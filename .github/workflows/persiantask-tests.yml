# Builds PersianTask and runs its tests, on every push to main and every pull
# request.  A manual run (workflow_dispatch) also runs upstream Taskwarrior's
# own tests with calendar=gregorian, which take several more minutes; the
# weekly upstream sync runs them too.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y uuid-dev

      - name: Build and test
        run: bash persiantask/build-and-test.sh

      - name: Upstream test suite
        if: github.event_name == 'workflow_dispatch'
        run: bash persiantask/upstream-tests.sh
