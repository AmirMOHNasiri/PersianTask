# Builds the prebuilt 'persiantask' Arch Linux package on every change to main,
# and publishes it in the pacman repository hosted on the 'repo' release.
#
# The package build runs the Jalali calendar tests, so a package is only
# published if they pass.  It is signed if the GPG_PRIVATE_KEY secret is set.
#
# A release tag, such as v3.5.0-persiantask.1 (see persiantask/release.sh),
# also creates its GitHub release, with the package, and its section of
# CHANGELOG.md as the notes.

name: Package

on:
  push:
    branches: [main]
    tags: ["v*-persiantask.*"]  # Tags ignore paths-ignore.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

# Publishing runs one at a time.  GitHub keeps at most one run waiting per
# group, and a newer one cancels it, so only workflows that publish to the
# pacman repository share this group: a run for main that waits behind
# another can be dropped, since the next one publishes a newer package.  A
# push to main right after a release could drop the release's waiting run
# too: then run this workflow by hand for the tag (Actions, Run workflow,
# and choose the tag).
concurrency:
  group: persiantask-publish
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm git cmake rust python github-cli

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # The package version counts the commits.

      # A release is pushed as main and its tag together: the run for the tag
      # builds and publishes it, so the run for main has nothing to do.
      - name: Check for a release tag
        id: release
        if: github.ref_type == 'branch'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if tag=$(git describe --exact-match --tags --match 'v*-persiantask.*' HEAD 2> /dev/null); then
            echo "This commit is release $tag, which the run for its tag publishes."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.release.outputs.skip != 'true'
        run: |
          # makepkg refuses to run as root.
          useradd --create-home builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "git config --global --add safe.directory '$GITHUB_WORKSPACE' && bash '$GITHUB_WORKSPACE/persiantask/build-package.sh'"

      - name: Check the release version
        if: github.ref_type == 'tag'
        run: |
          cd persiantask/out
          bsdtar -xf persiantask-[0-9]*-x86_64.pkg.tar.zst usr/bin/task
          version=$(./usr/bin/task --version)
          rm -r usr
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The package is version $version, but the tag is $GITHUB_REF_NAME." >&2
            exit 1
          fi

      - name: Publish repository
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: bash persiantask/publish-repo.sh

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=${GITHUB_REF_NAME#v}
          bash persiantask/release-notes.sh "$version" > release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "PersianTask $version" --notes-file release-notes.md \
            persiantask/out/persiantask-[0-9]*-x86_64.pkg.tar.zst*
