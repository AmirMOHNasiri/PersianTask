# Builds PersianTask and runs the Jalali calendar tests, on every push to main
# and every pull request.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y uuid-dev

      - name: Build and test
        run: bash persiantask/build-and-test.sh
